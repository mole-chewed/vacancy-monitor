[candidate]
name = "Senior Backend Developer"
summary = "13+ years backend engineering, strong Ruby on Rails, PostgreSQL, Redis, Sidekiq, REST API, GraphQL, Docker, AWS. Transitioning toward GenAI backend, AI systems, AI platform, RAG, LLM integrations, automation, and agent-based systems."
preferred_language = "ru"

[preferences]
remote_only = true
remote_preferred = true
accept_russia = true
accept_moscow_hybrid = true
full_time_preferred = true
long_term_contract_ok = true

[hh]
applicant_history_url = "https://simferopol.hh.ru/applicant/negotiations"

[files]
ignored_vacancy_ids_dir = "ignored_vacancies.example"

[defaults.report]
cv_path = "data/Alexander_Kharitonov_CV_ENG_2026.pdf"
output_path = "reports/application_report.md"
hydrate_top = 20
top_apply = 5
top_maybe = 5
top_skip = 2

[defaults.export_my_applications]
output_path = "data/applied_history.html"
storage_state_path = "data/browser_storage_state.json"
login_wait_seconds = 0
import_status = "applied"

[salary]
currency = "RUR"
minimum = 250000
target = 400000
stretch = 550000

[weights]
ai_track_boost = 15
ruby_track_boost = 40
remote_bonus = 8
hybrid_bonus = 3
onsite_penalty = 12
python_strong_penalty = 16
frontend_penalty = 18
product_penalty = 22
ml_research_penalty = 30
n8n_penalty = 10

[ranking]
primary_track = "ruby"
secondary_track = "ai"
primary_track_weight = 1.35
mixed_track_weight = 1.2
secondary_track_weight = 1.0

[keywords]
ai_positive = ["genai", "ai", "llm", "rag", "embeddings", "vector db", "pgvector", "qdrant", "ai automation", "agents", "tool calling", "ai platform", "ai systems", "prompt engineering"]
ruby_positive = ["ruby", "ruby on rails", "ror", "rails", "sidekiq"]
backend_positive = ["backend", "api", "integration", "postgresql", "redis", "graphql", "docker", "aws"]
negative = ["cpo", "chief product officer", "head of product", "product manager", "product lead", "frontend", "react", "ml research", "research scientist"]

[search.ai_primary]
enabled = true
source = "hh"
priority = 20
label = "AI Primary"
text = "((GenAI OR AI OR LLM OR RAG OR \"AI platform\" OR \"AI systems\" OR \"AI automation\") AND (backend OR integrations OR API OR platform))"
per_page = 100
pages = 1
fetch_all = true
schedule = "remote"
only_with_salary = false
detailed = false
order_by = "publication_time"

